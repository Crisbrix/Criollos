<main class="app">
  <!-- Login Screen -->
  <ng-container *ngIf="!state.token; else loggedIn">
    <section class="login-screen">
      <div class="login-bg">
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>
        <div class="bg-shape"></div>

        <div class="login-container" [ngClass]="{ 'register-container': authMode === 'register' }" [style.transform]="containerTransform" (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave()">
          <div class="login-header">
            <div class="logo-container">
              <div class="logo">C</div>
              <h1 class="login-title">Criollo S</h1>
            </div>
            <p class="login-subtitle">{{ authMode === 'login' ? 'Inicia sesión' : 'Crea tu cuenta' }}</p>
          </div>

          <!-- LOGIN FORM -->
          <form *ngIf="authMode === 'login'" (ngSubmit)="login()" class="form">
            <div class="form-group">
              <input type="email" class="form-input" placeholder=" " name="loginEmail" [(ngModel)]="loginForm.email" required>
              <label class="form-label">Correo electrónico</label>
            </div>
            <div class="form-group">
              <input type="password" class="form-input" placeholder=" " name="loginPassword" [(ngModel)]="loginForm.password" required>
              <label class="form-label">Contraseña</label>
            </div>

            <div class="login-options">
              <label class="remember-me">
                <input type="checkbox" name="rememberMe">
                Recordarme
              </label>
              <button type="button" class="forgot-password">¿Olvidaste tu contraseña?</button>
            </div>

            <button type="submit" class="login-btn" [disabled]="loginLoading">
              <span class="btn-text" [style.opacity]="loginLoading ? '0' : '1'">Iniciar Sesión</span>
              <div class="loading" *ngIf="loginLoading"><div class="spinner"></div></div>
            </button>
          </form>

          <div class="social-login" *ngIf="authMode === 'login'">
            <p class="social-text">O continúa con</p>
            <div class="social-buttons">
              <button type="button" class="social-btn" (click)="socialLogin('Google')">G</button>
              <button type="button" class="social-btn" (click)="socialLogin('Facebook')">F</button>
              <button type="button" class="social-btn" (click)="socialLogin('Twitter')">T</button>
            </div>
          </div>

          <!-- REGISTER FORM -->
          <form *ngIf="authMode === 'register'" (ngSubmit)="crearUsuario()" class="form register-form">
            <div class="form-grid">
              <div class="form-group">
                <input class="form-input" placeholder=" " name="cedula" [(ngModel)]="usuarioForm.cedula" required>
                <label class="form-label">Cedula</label>
              </div>
              <div class="form-group">
                <input class="form-input" placeholder=" " name="nombre" [(ngModel)]="usuarioForm.nombre" required>
                <label class="form-label">Nombre</label>
              </div>
              <div class="form-group">
                <input class="form-input" placeholder=" " name="apellido" [(ngModel)]="usuarioForm.apellido">
                <label class="form-label">Apellido</label>
              </div>
              <div class="form-group">
                <input class="form-input" placeholder=" " name="username" [(ngModel)]="usuarioForm.username">
                <label class="form-label">Username</label>
              </div>
              <div class="form-group full-field">
                <input type="email" class="form-input" placeholder=" " name="email" [(ngModel)]="usuarioForm.email" required>
                <label class="form-label">Email</label>
              </div>
              <div class="form-group">
                <input type="password" class="form-input" placeholder=" " name="password" [(ngModel)]="usuarioForm.password" required>
                <label class="form-label">Contraseña</label>
              </div>
              <div class="form-group">
                <input type="number" class="form-input" placeholder=" " name="edad" [(ngModel)]="usuarioForm.edad">
                <label class="form-label">Edad</label>
              </div>
              <div class="form-group">
                <input type="tel" class="form-input" placeholder=" " name="telefono" [(ngModel)]="usuarioForm.telefono">
                <label class="form-label">Teléfono</label>
              </div>
              <div class="form-group">
                <input class="form-input" placeholder=" " name="role" [(ngModel)]="usuarioForm.role">
                <label class="form-label">Rol</label>
              </div>
              <div class="form-group">
                <input class="form-input" placeholder=" " name="estado" [(ngModel)]="usuarioForm.estado">
                <label class="form-label">Estado</label>
              </div>
            </div>
            <button type="submit" class="login-btn">Registrarse</button>
          </form>

          <!-- Auth Mode Toggle -->
          <div class="signup-link">
            <ng-container *ngIf="authMode === 'login'">
              ¿No tienes cuenta? <button type="button" class="text-link" (click)="authMode = 'register'">Regístrate</button>
            </ng-container>
            <ng-container *ngIf="authMode === 'register'">
              ¿Ya tienes cuenta? <button type="button" class="text-link" (click)="authMode = 'login'">Inicia sesión</button>
            </ng-container>
          </div>
        </div>
      </div>
    </section>
  </ng-container>

  <!-- Main Application -->
  <ng-template #loggedIn>
    <!-- Animated background shapes -->
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>

    <div class="logged-in-layout">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Criollo S</h2>
        </div>

        <nav class="nav-steps">
          <button *ngFor="let step of steps" class="nav-step" [class.active]="currentView === step.view" (click)="currentView = step.view">
            <span>{{ step.label }}</span>
          </button>
        </nav>

        <div class="user-card">
          <div class="avatar">{{ (state.usuario.nombre || 'U').charAt(0) }}</div>
          <div>
            <p class="user-name">{{ state.usuario.nombre || 'Usuario' }}</p>
            <p class="user-email">{{ state.usuario.email || 'email@test.com' }}</p>
          </div>
          <button type="button" class="logout-btn" (click)="reset()">X</button>
        </div>
      </aside>

      <!-- Main Content Area -->
      <section class="main-content">
        <app-producto *ngIf="currentView === 'productos'"></app-producto>
        <app-pedido *ngIf="currentView === 'pedidos'"></app-pedido>
        <app-dashboard *ngIf="currentView === 'seguimiento'"></app-dashboard>
      </section>
    </div>
  </ng-template>
</main>
